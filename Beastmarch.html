<title>Beastmarch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&family=Pirata+One&display=swap">
<style>
/* Layout: phone-first single column (status, map or battle stage, message log, controls). From 900px the stage sits left and the log and controls form a side rail. */
:root{
  --bg:#E4E9E3; --surface:#F3F6F1; --surface2:#D8DFD7; --ink:#15211E; --ink2:#46564F; --line:#AEBBB3;
  --accent:#17695F; --accent-ink:#FFFFFF; --gold:#8A5F0A; --hp:#B8352B; --bad:#B8352B; --xp:#2F63A8; --focus:#0B57D0;
  --log-info:#46564F; --log-good:#1F6B35; --log-bad:#A82A20; --log-loot:#8A5F0A;
  --display:"Pirata One","UnifrakturCook",Georgia,serif;
  --body:"Alegreya Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#17211E; --surface2:#222F2B; --ink:#E3EBE6; --ink2:#9DB0A8; --line:#34453F;
  --accent:#4FC0AE; --accent-ink:#04211C; --gold:#E3B24F; --hp:#E0594D; --xp:#5E9BE6; --focus:#8AB4FF;
  --log-info:#9DB0A8; --log-good:#6CCB84; --log-bad:#F0786C; --log-loot:#E3B24F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#17211E; --surface2:#222F2B; --ink:#E3EBE6; --ink2:#9DB0A8; --line:#34453F;
  --accent:#4FC0AE; --accent-ink:#04211C; --gold:#E3B24F; --hp:#E0594D; --xp:#5E9BE6; --focus:#8AB4FF;
  --log-info:#9DB0A8; --log-good:#6CCB84; --log-bad:#F0786C; --log-loot:#E3B24F; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:17px/1.4 var(--body);
  padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1100px;margin:0 auto;display:grid;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:400 34px/1 var(--display);letter-spacing:.02em;margin:0}
h2{font:400 26px/1.1 var(--display);margin:0 0 8px;letter-spacing:.02em}
h3{font:700 13px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:14px 0 6px}
p{margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.cols{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.left,.right{display:grid;gap:12px;min-width:0;align-content:start}
@media (min-width:900px){.cols{grid-template-columns:minmax(0,1fr) 360px}}
button{font:inherit;color:inherit}
.b{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 8px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);cursor:pointer;text-align:left}
.b:hover:not(:disabled){border-color:var(--ink2)}
.b:disabled{opacity:.45;cursor:not-allowed}
.b.sm{min-height:36px;padding:0 10px;font-size:15px}
.b.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.b.pri kbd{color:var(--accent-ink);border-color:currentColor;background:transparent}
.b.danger{border-color:var(--hp)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
kbd{font:600 11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--surface);color:var(--ink2);white-space:nowrap}
.hud{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.lv{font:600 15px var(--mono);white-space:nowrap}
.meter{flex:1 1 110px;min-width:0}
.lab{display:flex;justify-content:space-between;font:600 12px var(--mono);color:var(--ink2);margin-bottom:3px;gap:8px}
.bar{height:9px;background:var(--surface2);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--hp);transition:width .25s}
.bar.xp>i{background:var(--xp)}
.bar.sm{height:7px}
.gold{font:600 15px var(--mono);color:var(--gold);white-space:nowrap}
.where{justify-content:space-between}
.dim{color:var(--ink2);font:500 13px var(--mono)}
.zone{font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font:600 13px var(--mono);background:var(--surface);white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.tc{display:inline-block;background:var(--c);color:var(--ci);border-radius:4px;padding:1px 7px;font:600 12px var(--mono)}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#map{display:block;width:100%;height:auto;aspect-ratio:15/11}
#panel{padding:14px;min-height:300px}
#log{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;height:150px;overflow:auto;font-size:16px}
@media (min-width:900px){#log{height:230px}}
#log p{margin:0 0 5px;color:var(--log-info)}
#log p.good{color:var(--log-good)}#log p.bad{color:var(--log-bad)}#log p.loot{color:var(--log-loot)}
#dock{display:grid;gap:8px}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-auto-rows:48px;gap:6px}
.pad .b{justify-content:center;padding:0;font:700 20px var(--mono)}
.dockrow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px;flex:1 1 220px;min-width:0}
.cmds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cmds .b{justify-content:flex-start;flex-wrap:wrap;line-height:1.15;padding-block:6px}
.b .sub{font:500 12px var(--mono);color:var(--ink2);width:100%}
.ab{display:inline-block;border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:0 6px;font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
#dock{transition:opacity .15s}
.art{display:inline-block;flex:none}
.art svg{width:100%;height:100%;display:block}
.art.port{background:var(--surface2);border-radius:12px;border:1px solid var(--line)}
.card{content-visibility:auto;contain-intrinsic-size:auto 150px}
#dock.locked .b{opacity:.45;pointer-events:none}
.hint{font-size:14px;color:var(--ink2)}
.npc{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.npc h2{margin:0}
.say{font-size:19px;line-height:1.45;border-left:3px solid var(--gold);padding-left:12px;margin:10px 0}
.qcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--bg)}
.qcard.ready{border-color:var(--log-good);box-shadow:0 0 0 1px var(--log-good)}
.qh{margin-bottom:4px}
.obj{margin:4px 0 6px;padding-left:20px}
.obj li{margin:2px 0}.obj li.ok{color:var(--log-good)}
.okn{color:var(--log-good)}.lackn{color:var(--log-bad)}
.mats{margin:0 0 6px}
.list{display:grid;gap:6px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.item .grow{flex:1;min-width:0}
.item.dead{opacity:.6}
.grid2{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);min-width:0}
.card.unk{opacity:.55}
.bt{display:grid;gap:14px}
.unit{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center}
.sigil{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font:700 30px var(--mono);background:var(--c);color:var(--ci);border:3px solid var(--surface2)}
.foe .sigil{width:84px;height:84px;font-size:42px}
.you .sigil{background:var(--accent);color:var(--accent-ink)}
.nm{font-weight:700;font-size:19px}
.scene{font-size:16px;min-height:4.2em;border-left:3px solid var(--line);padding-left:10px;color:var(--ink2)}
.scene p{margin:0 0 3px}
.mono{font-family:var(--mono)}
.title{display:grid;gap:12px;justify-items:start}
.title .big{font:400 54px/1 var(--display)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
#wmap{width:100%;height:auto;aspect-ratio:5/4;display:block;border:1px solid var(--line);border-radius:6px}

.signline{font-size:20px;margin:4px 0 10px}
.cal{display:flex;gap:10px;align-items:center}
.cal .rk{font:400 34px/1 var(--display);width:40px;text-align:center}
.cal.mine{border-color:var(--accent);background:var(--surface2)}
.cal .when{text-align:right;white-space:nowrap}
.today{color:var(--accent)}
.rounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:8px}
.rnd{border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.rnd.cur{border-color:var(--accent)}
.rnd h3{margin:0 0 4px}
.mt{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;font-size:14px;padding:3px 0;border-top:1px solid var(--line)}
.mt span:last-child{text-align:right}
.mt.me{background:var(--surface2);border-radius:4px;padding-left:4px;padding-right:4px}
.mt .w{font-weight:700}.mt .l{opacity:.55}
.vs{opacity:.7;font-family:var(--mono);font-size:12px}
.pip{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid var(--ink2);margin-right:3px;vertical-align:middle}
.pip.on{background:var(--ink2)}
.arhead{margin-bottom:6px}
.bad{color:var(--bad,#C0392B)}

.evo{display:grid;gap:10px;justify-items:center;text-align:center}
.evt{font:400 44px/1 var(--display);margin:0;color:var(--gold);animation:evFade .8s .2s both}
.stage2{position:relative;width:210px;height:210px;display:grid;place-items:center}
.stage2>*{grid-area:1/1}
.stage2 .glow{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--gold) 0%,transparent 68%);opacity:0;animation:evGlow 2.6s ease-in-out both}
.stage2 .old{animation:evOld 1.5s ease-in both}
.stage2 .new{animation:evNew 1.2s 1.3s cubic-bezier(.2,1.4,.4,1) both}
.stage2 .spark{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4px;border-radius:50%;background:var(--gold);opacity:0;animation:evSpark 1.4s 1.25s ease-out both}
.evsub{animation:evFade .6s 2s both}.evbody{animation:evFade .7s 2.3s both;display:grid;gap:8px;justify-items:center;width:100%}
.evstats{display:grid;gap:2px;width:min(360px,100%)}
.evr{display:grid;grid-template-columns:76px 1fr 18px 1fr 52px;gap:6px;align-items:baseline;text-align:left;border-bottom:1px solid var(--line);padding:2px 0}
.dlt{text-align:right;font-family:var(--mono);font-size:13px;opacity:.7}.dlt.up{color:var(--accent);opacity:1;font-weight:700}
.evfacts{margin:0;padding-left:18px;text-align:left;font-size:15px}
.evmoves,.evtype p{margin:0}
@keyframes evOld{0%{opacity:1;filter:none;transform:scale(1)}60%{opacity:1;filter:brightness(3) saturate(0);transform:scale(1.08)}100%{opacity:0;filter:brightness(6) saturate(0);transform:scale(1.2)}}
@keyframes evNew{0%{opacity:0;filter:brightness(6) saturate(0);transform:scale(.6)}100%{opacity:1;filter:none;transform:scale(1)}}
@keyframes evGlow{0%{opacity:0;transform:scale(.4)}45%{opacity:.9;transform:scale(1.1)}100%{opacity:0;transform:scale(1.5)}}
@keyframes evSpark{0%{opacity:1;transform:rotate(var(--a)) translateX(10px)}100%{opacity:0;transform:rotate(var(--a)) translateX(115px)}}
@keyframes evFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.stage2 .old,.stage2 .glow,.stage2 .spark{display:none}.evt,.stage2 .new,.evsub,.evbody{animation:none}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
<div class="app">
  <header class="top">
    <h1>Beastmarch</h1>
    <div class="row"><button class="b sm" data-k="__save">Save</button><button class="b sm" data-k="Escape">Menu <kbd>Esc</kbd></button></div>
  </header>
  <div class="cols">
    <div class="left">
      <section class="hud" id="hud" aria-label="Status" hidden>
        <div class="row">
          <div class="lv">Lv <b id="hl">1</b></div>
          <div class="meter"><div class="lab"><span>HP</span><span id="hhp"></span></div><div class="bar"><i id="hhpb"></i></div></div>
          <div class="meter"><div class="lab"><span>XP</span><span id="hxp"></span></div><div class="bar xp"><i id="hxpb"></i></div></div>
          <div class="gold"><span id="hg">0</span> gold</div>
        </div>
        <div class="row where"><span class="zone" id="hz"></span><span id="hd"></span><span class="dim" id="hday"></span></div>
      </section>
      <section class="stage">
        <canvas id="map" width="600" height="440" role="img" aria-label="Map of your surroundings" hidden></canvas>
        <div id="panel"></div>
      </section>
    </div>
    <div class="right">
      <section id="log" aria-live="polite" aria-label="Message log"></section>
      <section id="dock" aria-label="Controls"></section>
    </div>
  </div>
</div>

  const t=MV[sp.t];

  const bst=p[0]+p[1]+p[2]+p[3],m=Math.max(minMul,base-bst/(base>1.5?700:900));

}

 {id:'yeti_king',giver:'hrolf',title:'The Yeti Who Knew Too Much',min:14,after:'wolf_door',obj:[{t:'kill',zone:'frost',elite:true,n:1,label:'Defeat the Alpha of Frostspine'}],
  ask:'The Alpha Yeti has been telling the other yetis about my stew recipe. I cannot have that. Defeat him before he reaches the soup course.',
  prog:'The Alpha Yeti. He knows the recipe. Hurry.',
  done:'The recipe is safe! The stew is safe! I am emotionally unsafe, but that is a different problem. Take these.',
  xp:650,items:{gilded:1,tonic:2},mats:{diamond:1,sapphire:1,moonstone:1}},

 {id:'boots',giver:'slosh',title:'My Boots Left Me',min:8,obj:[{t:'kill',aq:true,zone:'mire',n:3,label:'Defeat water beasts in Mirelow Fen'}],
  ask:"Squelch. My boots walked off into the mere last Tuesday, and I think the water things know why. Defeat three of them and one will confess. A skiff helps, or a steady hand on the shore.",
  prog:'Three water things. The boots are somewhere. I can feel it in my feet.',
  done:'No confession, but the water is calmer. Good enough. The boots will turn up. Boots always return, eventually, with a worse attitude.',
  xp:260,items:{tonic:1},mats:{newt:1,myrtle:2}},
 {id:'croak',giver:'slosh',title:'Mayor Croak Demands Representation',min:8,after:'boots',obj:[{t:'bind',sp:'kappa',n:1,label:'Bind a Kappa'}],
  ask:'Mayor Croak (a frog, elected) wants a kappa on the council. Do not ask how the election went. Bind a kappa and carry it to the water with your head held high.',
  prog:'A kappa for the council. Mayor Croak taps his foot.',
  done:'(Mayor Croak croaks approvingly. Slosh translates: "He says you are a credit to the swamp.")',
  xp:280,items:{salve:2},mats:{jade:1,myrtle:2}},
 {id:'tea_party',giver:'slosh',title:'The Sunken Tea Party',min:9,after:'croak',obj:[{t:'sail',n:25,label:'Sail 25 stretches of open water'},{t:'item',name:'Waterlogged Teacups',n:3,aq:true,zone:'mire',chance:.5,label:'Waterlogged Teacups'}],
  ask:'A party sank in the fen decades ago. Fine china. Poor judgment. Sail out and bring back three teacups from whatever lives in the mere. Mind the guests. Some are still attending.',
  prog:'Sail the fen and take three teacups from the beasts that live there.',
  done:'(He holds a teacup to the light.) Still warm. No, I do not know why either. Here, for the trouble.',
  xp:380,items:{salve:3},mats:{opal:1,onyx:1,amethyst:1,myrtle:1}},

 {id:'lava',giver:'mcg',title:'Lava Is Not a Personality',min:14,obj:[{t:'kill',zone:'cinder',n:4,label:'Defeat beasts in the Cinder Barrens'}],
  ask:'Forty years prospecting and the only gold I ever found was a tooth. Mine. The Barrens are crawling with things that think they own the place. Defeat four of them and I will pay in what I have.',
  prog:'Four Barrens beasts. The lava is only part of the problem.',
  done:'Hah! Four. Not bad. You may stay. The lava is not a person, by the way. People keep asking.',
  xp:500,items:{salve:3},mats:{saltskin:2,pepper:2}},
 {id:'sooty',giver:'mcg',title:'Sooty Fingers',min:14,after:'lava',obj:[{t:'item',name:'Singed Gold Nuggets',n:3,zone:'cinder',chance:.45,label:'Singed Gold Nuggets'}],
  ask:'The beasts here swallow gold. I do not ask why. I ask you to bring me three singed nuggets, extracted the way you extract anything from a beast. Politely. Ish.',
  prog:'Three Singed Gold Nuggets. They are in the beasts. Not in the lava. I checked.',
  done:'Look at that shine! Almost makes up for the forty years. Almost.',
  xp:600,mats:{gold:1,ruby:1,garnet:1}},
 {id:'drakefall',giver:'mcg',title:'Drakefall or Bust',min:17,after:'sooty',obj:[{t:'visit',zone:'drake',label:'Reach Drakefall'}],
  ask:'Past the barrens the air gets thin, and the dragons get thick. I want to know if the stories are true. Walk into Drakefall and tell me. Do not die. I am not a good liar at funerals.',
  prog:'Walk into Drakefall. Then walk back out. Order matters.',
  done:'Dragons! In the flesh! Or the scale! Or whatever. I am so jealous I could eat a boot.',
  xp:700,mats:{sapphire:1,diamond:1,feather:1}},
 {id:'whelp',giver:'mcg',title:'Alpha Whelp, Omega Headache',min:18,after:'drakefall',obj:[{t:'kill',zone:'drake',elite:true,n:1,label:'Defeat the Alpha of Drakefall'}],
  ask:'The biggest drake in the Fall has been eating my reputation. I would like it to stop. Defeat him. I will cheer from over here. Loudly. A safe distance away.',
  prog:'The Alpha of Drakefall. I will cheer, I promise.',
  done:'(He stares at the spoils, then at you, then at the spoils.) Take it. Take all of it. I cannot carry it anyway. My knees are asking me to stop.',
  xp:1400,items:{gilded:2,tonic:2},mats:{diamond:1,gold:2,ruby:1,moonstone:1,emerald:1}}];
QUESTS.push(
 {id:'sm1',giver:'ozma',title:"Mr. Tuesday's Request",min:14,obj:[{t:'item',name:'Stormfeathers',n:3,zone:['frost','drake'],sp:'thunderbird',chance:.5,label:'Stormfeathers'}],
  ask:'(She whispers.) There is a bird older than the mountains. Simurgh. To wake her I need three relics, and the first is a Stormfeather, from the thunderbirds of Frostspine or Drakefall. Mr. Tuesday insists. He has never been wrong, though he has never been asked.',
  prog:'Three Stormfeathers. Thunderbirds. They are not shy, only mean.',done:'(She holds a feather up to the lamp, whispering approvingly.) The first relic. Take it. Guard it. Do not lend it to Mr. Tuesday.',
  xp:520,mats:{feather:1},relics:{sm1:1}},
 {id:'sm2',giver:'ozma',title:'The Cat Is Unimpressed',min:17,after:'sm1',obj:[{t:'kill',zone:'drake',n:3,label:'Defeat beasts in Drakefall'}],
  ask:'The second relic sleeps in the Fall, inside a drake that will not give it up willingly. Defeat three beasts there. Mr. Tuesday says this is the easy part. He is a cat. He says many things.',
  prog:'Three beasts in Drakefall. Mr. Tuesday is watching. He is judging.',done:'The seed! Look at it. It hums. I have not heard a seed hum since I was forty. That is, since I was seventy-eight.',
  xp:900,mats:{feather:1,saltskin:1},relics:{sm2:1}},
 {id:'sm3',giver:'ozma',title:'Aerie Hunting',min:18,after:'sm2',obj:[{t:'visit',x:40,y:6,r:6,label:'Find the Aerie Altar in north-western Drakefall'}],
  ask:'The third relic lies beside her altar, in the north-west corner of Drakefall. Find the place. Do not touch anything. Mr. Tuesday would, but he is not invited.',
  prog:'North-western Drakefall. An altar. Do not touch it yet.',done:'You found it. Take the cup. With all three relics, stand at the altar and press E twice. Then pray, politely.',
  xp:1000,mats:{diamond:1},relics:{sm3:1},reveal:'simurgh'},
 {id:'bh1',giver:'tarquin',title:'Bells and Boulders',min:10,obj:[{t:'item',name:'Chiming Pebbles',n:4,zone:'crag',chance:.45,label:'Chiming Pebbles'}],
  ask:'WHAT? YES! A BEHEMOTH SLEEPS IN THE CRAGS. I KNOW BECAUSE THE BELLS RING WHEN IT SNORES. Bring me four Chiming Pebbles from the beasts out there. Bells need pebbles. It is in the bell rules.',
  prog:'FOUR PEBBLES. THEY CHIME. THE BEASTS SWALLOW THEM. I DO NOT KNOW WHY.',done:'(He rings a bell for no reason.) THE FIRST RELIC! A RING MADE OF TUSK! IT RINGS! I MEAN, IT DOESN\'T, BUT IT FEELS LIKE IT SHOULD!',
  xp:300,mats:{iron:1,copper:1},relics:{bh1:1}},
 {id:'bh2',giver:'tarquin',title:'A Bell for a Bell',min:11,after:'bh1',obj:[{t:'kill',sp:['tatzel','manticore'],zone:'crag',n:3,label:'Defeat Tatzelwurms or Manticores in Ashen Crags'}],
  ask:'THE SECOND RELIC IS A BOULDER-HEART, STILL BEATING. SOMETIMES IT ROLLS. FIND IT IN THE BODIES OF THE TATZELWURMS AND MANTICORES, THE ONES WITH BELL-SHAPED GRUDGES.',
  prog:'THREE OF THEM! TATZELWURMS OR MANTICORES! IN THE CRAGS!',done:'IT BEATS! IT ROLLS! I AM SO PROUD I COULD RING A WHOLE TOWER!',
  xp:380,mats:{iron:1,ruby:1},relics:{bh2:1}},
 {id:'bh3',giver:'tarquin',title:'The Great Echo',min:12,after:'bh2',obj:[{t:'visit',x:118,y:70,r:5,label:'Find the Boulder Altar in the heart of the Crags'}],
  ask:'THE THIRD RELIC IS A BELL. IT LIES BESIDE THE BEHEMOTH\'S ALTAR, WEST OF CRAGWATCH, IN THE HEART OF THE CRAGS. GO THERE. LISTEN. IF YOU HEAR A BELL, THAT IS THE BELL. IF YOU HEAR TWO, RUN.',
  prog:'THE ALTAR IS WEST OF CRAGWATCH, IN THE CRAGS. LISTEN FOR BELLS.',done:'YOU FOUND IT! WITH ALL THREE RELICS, PRESS E TWICE AT THE ALTAR! BRING A GILDED CORD! AND EARPLUGS!',
  xp:450,mats:{silver:1,onyx:1},relics:{bh3:1},reveal:'behemoth'},
 {id:'jt1',giver:'brynja',title:'Exactly One Giant',min:13,obj:[{t:'kill',zone:'frost',n:4,label:'Defeat beasts in Frostspine'}],
  ask:'They say a frost giant sleeps beneath Frostspine. Tall as seven yetis, I tell people, though some say nine. Four beasts of the ridge must fall first, to wake his tooth. Do not ask how that works. The story does not specify.',
  prog:'Four beasts, Frostspine. The giant is exactly the right size for this story.',done:'(She holds up the tooth.) The Frost-Giant\'s Tooth. I am told it is the size of a door. I measured it. It is the size of a very big door.',
  xp:420,mats:{lichen:2,silver:1},relics:{jt1:1}},
 {id:'jt2',giver:'brynja',title:'Embellishment',min:13,after:'jt1',obj:[{t:'item',name:"Giant's Fingernail Clippings",n:3,zone:'frost',sp:['yeti','fenrirpup'],chance:.5,label:"Giant's Fingernail Clippings"}],
  ask:'For the second relic I need the Giant\'s fingernail clippings. They are carried by yetis and wolf-pups of the ridge, as tribute. Take them politely. Then take them anyway.',
  prog:'Three clippings. From yetis and wolf pups. It is a very specific market.',done:'Clippings! The Rimed Anvil Chip! The giant used it to shape his nails, I believe. It was his only tool and his only joy.',
  xp:480,mats:{moonstone:1,lichen:1},relics:{jt2:1}},
 {id:'jt3',giver:'brynja',title:'The Frozen Throne',min:14,after:'jt2',obj:[{t:'visit',x:58,y:46,r:5,label:'Find the Frozen Throne in southern Frostspine'}],
  ask:'The throne lies in the south of the ridge, below the road and west of the sleeping places. Go and see. If you see more than one giant, you have gone too far, or I was right all along.',
  prog:'The south of Frostspine. A throne. Possibly a giant. Possibly several.',done:'You found it! The last relic, a splinter of the throne itself. With all three, stand at the altar and press E twice. And bring a good coat, friend.',
  xp:560,mats:{sapphire:1,silver:1},relics:{jt3:1},reveal:'jotun'},
 {id:'sr1',giver:'embera',title:'Singe Benefit',min:15,obj:[{t:'kill',zone:'cinder',n:5,label:'Defeat beasts in the Cinder Barrens'}],
  ask:'Welcome to Emberwatch! I am Embera, I am on fire, and I am doing fine. The old fire-king Surtr sleeps in the Barrens, and wakes only to three relics. Start by knocking five beasts down. The first relic is a Cooled Ember-Heart, and they keep them. Do not ask where.',
  prog:'Five beasts in the Barrens. They are hot. They are loud. They are not friends.',done:'Look at that! A Cooled Ember-Heart! Only slightly warm! I am so happy I could set something on fire.',
  xp:650,mats:{pepper:2,saltskin:1},relics:{sr1:1}},
 {id:'sr2',giver:'embera',title:'Fire Safety Inspection',min:15,after:'sr1',obj:[{t:'item',name:'Ash-Crowned Shards',n:3,zone:'cinder',sp:['chimera','wyvern'],chance:.5,label:'Ash-Crowned Shards'}],
  ask:'The second relic is a shard of a crown made from ash. Chimeras and wyverns wear them like hats. They are not good hats. Take three. I will not inspect them. I will, however, feel them.',
  prog:'Three shards. From chimeras and wyverns. They have opinions about hats.',done:'(She runs her fingers over the shard.) Ow. Lovely. Yes. Ow.',
  xp:780,mats:{ruby:1,garnet:1},relics:{sr2:1}},
 {id:'sr3',giver:'embera',title:'Where the Smoke Goes',min:16,after:'sr2',obj:[{t:'visit',x:150,y:12,r:5,label:'Find the Cinder Altar in the far north-east'}],
  ask:'The last relic is beside Surtr\'s altar, far north-east of the Barrens. Follow the smoke. If the smoke follows you, you have gone the wrong way, or the right way too fast.',
  prog:'Far north-east. Follow the smoke. Do not let it follow you.',done:'You made it! The Pyre-Stone Key. With all three relics, stand at the altar and press E twice. Wear something fireproof. Or nothing. Both have been tried.',
  xp:900,mats:{gold:1,onyx:1},relics:{sr3:1},reveal:'surtr'},
 {id:'ry1',giver:'saba',title:'Tea for the Thirsty',min:11,obj:[{t:'item',name:'Oasis Pearls',n:3,zone:['mire','dunes'],aq:true,chance:.5,label:'Oasis Pearls'}],
  ask:'Dragons drink tea, you know. The Dragon-King Ryujin sleeps beneath the fen, and wakes for three relics. The first is the Pearl of Still Water. Bring me three Oasis Pearls from the water beasts, and I will brew you something that costs eight gold. It is free for you. The invoice is for the dragon.',
  prog:'Three Oasis Pearls, from water beasts in the fen or the oasis. Tea waits for no one.',done:'(She weighs a pearl on a tiny scale, then bites it.) Genuine. Here, the first relic, and no invoice. Do not tell anyone.',
  xp:340,mats:{jade:1,newt:1},relics:{ry1:1}},
 {id:'ry2',giver:'saba',title:'Hard Sell',min:12,after:'ry1',obj:[{t:'kill',aq:true,n:4,label:'Defeat water beasts'}],
  ask:'The second relic is a Tide-Etched Scale, and the water beasts hide it. I would deal with them myself but I am, regrettably, a tea merchant. Defeat four water beasts. Then I will sell you the scale at a fair price. Free. For you.',
  prog:'Four water beasts. A skiff helps. I sell skiffs, but I am not saying anything.',done:'The scale! Look at the etching! It says "Best Before Never." I am moved.',
  xp:400,mats:{amethyst:1,myrtle:1},relics:{ry2:1}},
 {id:'ry3',giver:'saba',title:'The Drowned Altar',min:12,after:'ry2',obj:[{t:'visit',x:96,y:112,r:5,label:'Find the Drowned Altar in southern Mirelow Fen'}],
  ask:'The last relic is by the Drowned Altar, in the southern fen, a short walk past the lair. Go and see. If a dragon rises, let it have the tea. I will not charge you.',
  prog:'The southern fen. An altar. A dragon, possibly. Bring tea.',done:'The altar! You found it! With the three relics, stand at the altar and press E twice. And take a spare skiff. And a cord. And a prayer.',
  xp:480,mats:{opal:1,jade:1},relics:{ry3:1},reveal:'ryujin'},
 {id:'nd1',giver:'nox',title:'Who Turned Off the Sun?',min:14,obj:[{t:'item',name:'Rootgnawed Fangs',n:3,zone:'gloam',chance:.45,label:'Rootgnawed Fangs'}],
  ask:'Below the Gloamwood roots there is a wyrm, Nidhogg, and it eats the dark. I am a lamplighter. I am in the dark business, I am saying. Bring me three Rootgnawed Fangs from the beasts of the wood, and I will light you a path. Several lamps. All of them, actually.',
  prog:'Three Rootgnawed Fangs, from beasts in the Gloamwood. Mind the roots.',done:'(He stares at the fang with deep, deep suspicion.) First relic. I am not touching it. You hold it. Hold it away from me.',
  xp:620,mats:{wolfsbane:2,toadstool:1},relics:{nd1:1}},
 {id:'nd2',giver:'nox',title:'Light Duty',min:15,after:'nd1',obj:[{t:'kill',zone:'gloam',n:5,label:'Defeat beasts in Gloamwood'}],
  ask:'The second relic is a Vial of Black Sap. It is in the beasts too. Do not ask me why it is in the beasts. I am not responsible for the biology. Defeat five of them. I will hold the lantern. From here.',
  prog:'Five beasts in Gloamwood. I will hold the lantern. From here, in town.',done:'The sap! It is black! It is darker than my darkest thought, and my darkest thought is the dark!',
  xp:760,mats:{onyx:1,amethyst:1},relics:{nd2:1}},
 {id:'nd3',giver:'nox',title:'Bring a Lantern',min:15,after:'nd2',obj:[{t:'visit',x:152,y:114,r:5,label:'Find the Rootbound Altar in the far south-east'}],
  ask:'The last relic is by the altar, in the far south-east of the wood, where the trees grow sideways. I would come, but I am busy. Hiding. Be brave on my behalf. I will be brave afterward, privately.',
  prog:'The far south-east of the Gloamwood. A lantern is advised. So is courage.',done:'You came back! The Wyrm-Bone Whistle! With all three relics, stand at the altar and press E twice. Take a lantern. Take two. Take all of mine.',
  xp:880,mats:{moonstone:1,emerald:1},relics:{nd3:1},reveal:'nidhogg'});

/* Quests that name a spot on the map were written for the original land, which now sits inside the larger world. */
for(const q of QUESTS)for(const o of q.obj)if(o.t==='visit'&&o.x!==undefined&&!o.shifted){o.x+=OX;o.y+=OY;o.shifted=1;}

/* ---------- the outer ring: five wanderers, and fifteen quests between them (levels 22 to 50) ---------- */
Object.assign(NPCS,{
 brine:{n:'Captain Odalys Brine',t:'Shipwreck salvager',g:'B',at:{wild:'shore',x:98,y:160},place:'Saltglass Shore, on the sand',
  low:'Come back when you can stand up to a crab, landlubber. The shore bites, and it bites in glass.',
  idle:['Thirty years I have salvaged this shore. The shore has salvaged me for thirty-one. I think it is winning.','That is not a rock. That is a very patient crab. Do not make eye contact.']},
 thessaly:{n:'Thessaly Vane',t:'Storm-chaser',g:'V',at:{wild:'mesa',x:206,y:124},place:'Thundermesa, on the high ground',
  low:'(She does not look away from the sky.) Not yet. When the lightning starts calling you by name, then we talk.',
  idle:['I have been struck seven times. The eighth is statistically overdue, and I am a patient woman.','Stand on the rock, not under it. Under it is where the other storm-chasers were.']},
 ferren:{n:'Ferren Mossback',t:'Warden of the Deepwood',g:'F',at:{wild:'deepwood',x:18,y:85},place:'The Deepwood, by the old stump',
  low:'The trees have noticed you. They are not impressed yet. Come back when they are, or when you are older.',
  idle:['The wood is older than the road, and it resents the road. It has told me so, at length.','Do not follow the path that is clearly marked. Follow the one that is not. Or do not. I am a tree warden, not a doctor.']},
 sibyl:{n:'Sibyl Hollowmere',t:'Fen witch',g:'Y',at:{wild:'witchfen',x:18,y:47},place:'Witchfen, beside the cauldron',
  low:'Not yet, dearie. The cauldron says you are underdone. It is rarely wrong, and when it is, it is on fire.',
  idle:['Eye of newt is an old wives tale. Eye of the second newt is the real recipe.','The fog here is not fog. It is the fen thinking. Please do not interrupt it.']},
 astra:{n:'Astra Quill',t:'Star-reader',g:'X',at:{wild:'starfall',x:46,y:16},place:'Starfall Plains, under the open sky',
  low:'(She squints at you, then at a chart, then at you.) The stars say wait. They also say they are bored. Come back later.',
  idle:['A star fell here once. I wrote down where. The star fell on the notebook. We are still friends.','Nothing is ever quiet out here. The quiet is just the loudest thing, listening.']}});
QUESTS.push(
 {id:'br1',giver:'brine',title:'Glass Half Full',min:22,obj:[{t:'kill',zone:'shore',n:5,label:'Defeat beasts in Saltglass Shore'}],
  ask:'The tide leaves glass, and the glass attracts beasts, and the beasts leave me no room to salvage. Defeat five of them. I will hold your coat. It is wet. That is not the sea. Do not ask.',
  prog:'Five beasts on Saltglass Shore. I am holding your coat. It is fine.',done:'(She examines the sand where you fought.) Clean work. Nobody bleeds like a shore beast. Here, for your trouble, and my sanity.',
  xp:2600,items:{salve:3,tonic:1},mats:{blackpearl:1,ghostcap:2}},
 {id:'br2',giver:'brine',title:'Pearls Before Swine',min:23,after:'br1',obj:[{t:'item',name:'Black Pearls',n:3,aq:true,zone:'shore',chance:.5,label:'Black Pearls'}],
  ask:'The water beasts here swallow pearls. They claim it is an accident. Bring me three black ones, taken from whatever lives in the shallows, and do ask nicely. Then do not.',
  prog:'Three Black Pearls, from the water beasts of Saltglass Shore.',done:'(She holds a pearl to the light and sighs.) Gorgeous. Cursed, probably, but gorgeous. Take your cut.',
  xp:3200,items:{gilded:1},mats:{mithril:1,tanzanite:1,blackpearl:1}},
 {id:'br3',giver:'brine',title:'The Mangrove Question',min:25,after:'br2',obj:[{t:'visit',zone:'mangrove',label:'Reach the Mangrove Maze'}],
  ask:'East of here the shore becomes a maze made of roots, and the roots are always moving. I lost a boat there. And a cousin. The cousin turned up. Go in, see what lives there, and come out. Preferably as you.',
  prog:'Walk into the Mangrove Maze. Walk out of it. In that order.',done:'You came out! The roots let you go? They do not do that. They must like you. Or they are saving you.',
  xp:3800,items:{tonic:2},mats:{wraithmoss:1,ghostcap:2,tanzanite:1}},
 {id:'th1',giver:'thessaly',title:'Lightning Rods',min:28,obj:[{t:'kill',zone:'mesa',n:5,label:'Defeat beasts in Thundermesa'}],
  ask:'Something up here is hitting the same rock over and over, and I would like to know if it is a creature or a grudge. Defeat five of the beasts on the mesa. If one of them is wearing a little hat, that is the grudge.',
  prog:'Five beasts on Thundermesa. Stay off the tall rocks. Particularly the one with the burn marks.',done:'(She laughs.) No hat. It was a creature. A grudge would have fought dirtier. Here. Take this before it strikes me instead.',
  xp:5200,items:{salve:3},mats:{stormroot:2,mithril:1}},
 {id:'th2',giver:'thessaly',title:'Root of the Problem',min:29,after:'th1',obj:[{t:'item',name:'Charged Stormroots',n:3,zone:'mesa',chance:.5,label:'Charged Stormroots'}],
  ask:'The roots on the mesa hum when the sky is angry, and the beasts eat them to stay angry too. Bring me three Charged Stormroots from the things up here. Wear rubber boots. I do not have any. Tell me how it goes.',
  prog:'Three Charged Stormroots, taken from the beasts of Thundermesa. Rubber boots recommended.',done:'(She holds one at arm\'s length and every hair on her head stands up.) Lovely. Hold this for me. Or do not. I will hold it. Nope. You hold it.',
  xp:5800,items:{gilded:1,tonic:1},mats:{sunstone:1,stormroot:2,feather:2}},
 {id:'th3',giver:'thessaly',title:'Alpha of the Sky',min:31,after:'th2',obj:[{t:'kill',zone:'mesa',elite:true,n:1,label:'Defeat the Alpha of Thundermesa'}],
  ask:'There is a thunderbird that nests where the storm is loudest. It is the reason the storm is loud. Defeat it, and I will finally hear myself think. I have not in eleven years. I miss it. A little.',
  prog:'The Alpha of Thundermesa. It is at the highest, loudest rock.',done:'(A very long silence.) Oh. Oh, that is wonderful. I can hear my own thoughts. They are mostly about lunch. Take everything.',
  xp:9000,items:{gilded:2,tonic:2},mats:{mithril:2,sunstone:2,diamond:1}},
 {id:'fe1',giver:'ferren',title:'Rootbound',min:34,obj:[{t:'kill',zone:'deepwood',n:5,label:'Defeat beasts in the Deepwood'}],
  ask:'The beasts are bolder than they were. They know the wood is angry and they feel entitled to be angry too. Defeat five of them. The wood will not say thank you. It will say nothing, loudly.',
  prog:'Five beasts in the Deepwood. The wood is watching. Be polite to it.',done:'(He pats a tree.) You hear that? No, you do not, because it is saying nothing. That is gratitude, here.',
  xp:7400,items:{salve:3,tonic:2},mats:{dreamleaf:2,jade:1}},
 {id:'fe2',giver:'ferren',title:'Sleep, Reluctantly',min:35,after:'fe1',obj:[{t:'item',name:'Dreamleaf Pods',n:3,zone:'deepwood',chance:.5,label:'Dreamleaf Pods'}],
  ask:'Dreamleaf grows in the bellies of the wood beasts, which is a strange place for it to grow, and I have stopped asking. Bring me three pods. I have not slept since the third tree whispered my name.',
  prog:'Three Dreamleaf Pods, from the beasts of the Deepwood.',done:'(He sniffs a pod and immediately sways.) Oh. Oh, yes. That is the stuff. Wake me in a week. Do not wake me.',
  xp:8200,items:{gilded:1},mats:{dreamleaf:2,wraithmoss:1,tanzanite:1}},
 {id:'fe3',giver:'ferren',title:'Into the Mist',min:36,after:'fe2',obj:[{t:'visit',zone:'mistvale',label:'Reach Mistvale'}],
  ask:'South-west of the wood the mist begins and never ends. Go in. Tell me whether it is thinking about me. I have always assumed it is. The mist has never confirmed it either way.',
  prog:'Walk into Mistvale. Walk out. The mist will have opinions on both.',done:'(He listens carefully.) It says you smell of lavender and good intentions. It also says it is hungry. I would leave soon.',
  xp:9400,items:{tonic:2},mats:{ghostcap:2,dreamleaf:2,starpetal:1}},

  const seen=new Uint8Array(W*H),q=[sy*W+sx];seen[q[0]]=1;
  for(let h=0;h<q.length;h++){
    const i=q[h],x=i%W,y=(i/W)|0;
    for(const [dx,dy] of D4){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const j=ny*W+nx;if(seen[j]||BLK[TILES[j]])continue;seen[j]=1;q.push(j);}
  }
  return seen;
}
/* A walled-off pocket may stay as an island only if nothing essential is on it, water is most of its
   shoreline, and that water touches the mainland so a boat can launch from there. */
function isIsland(comp,seen){
  let water=0,other=0;const wset=[];
  for(const i of comp){
    const x=i%W,y=(i/W)|0;
    if(inTown(x,y))return false;
    for(const [dx,dy] of D4){
      const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;
      const j=ny*W+nx,t=TILES[j];
      if(t===TL.LAIR||t===TL.SHRINE)return false;
      if(BLK[t]){if(t===TL.WATER){water++;wset.push(j);}else other++;}
    }
  }
  if(water<2||water<.6*(water+other))return false;
  const vis=new Uint8Array(W*H),q=[];
  for(const j of wset)if(!vis[j]){vis[j]=1;q.push(j);}
  for(let h=0;h<q.length;h++){
    const i=q[h],x=i%W,y=(i/W)|0;
    for(const [dx,dy] of D4){
      const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;
      const j=ny*W+nx;
      if(seen[j]&&!BLK[TILES[j]])return true;
      if(!vis[j]&&TILES[j]===TL.WATER){vis[j]=1;q.push(j);}
    }
  }
  return false;
}
/* Cut a path from any walled-off pocket to the main land, except pockets that qualify as islands. */
function connectAll(){
  let seen=reachFrom(START[0],START[1]);
  const judged=new Uint8Array(W*H);
  for(let s=0;s<W*H;s++){
    if(seen[s]||judged[s]||BLK[TILES[s]])continue;
    const comp=[s],mark=new Uint8Array(W*H);mark[s]=1;
    for(let h=0;h<comp.length;h++){
      const i=comp[h],x=i%W,y=(i/W)|0;
      for(const [dx,dy] of D4){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const j=ny*W+nx;if(mark[j]||BLK[TILES[j]])continue;mark[j]=1;comp.push(j);}
    }
    if(isIsland(comp,seen)){for(const i of comp)judged[i]=1;continue;}
    const par=new Int32Array(W*H).fill(-2),q=[s];par[s]=-1;let end=-1;
    for(let h=0;h<q.length&&end<0;h++){
      const i=q[h],x=i%W,y=(i/W)|0;
      for(const [dx,dy] of D4){
        const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const j=ny*W+nx;
        if(par[j]!==-2)continue;
        const t=TILES[j];if(t===TL.FENCE||t===TL.BWALL||t===TL.SIGN||t===TL.LAIR||t===TL.SHRINE||t===TL.BENCH)continue;
        par[j]=i;
        if(seen[j]){end=j;break;}
        q.push(j);
      }
    }
    for(let i=end;i>=0;i=par[i]){const t=TILES[i];if(BLK[t]){TILES[i]=t===TL.WATER?TL.BRIDGE:TL.G;}}
    seen=reachFrom(START[0],START[1]);
  }
}

/* Equipped rings and potion bonuses feed into your stats. */

/* The explored map is one bit per tile, so a save stays small and quick even on a big world. */
function packVis(v){
  const n=Math.ceil(v.length/8),b=new Uint8Array(n);
  for(let i=0;i<v.length;i++)if(v[i])b[i>>3]|=1<<(i&7);
  let s='';for(let i=0;i<n;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));
  return btoa(s);
}
function unpackVis(str){
  const v=new Uint8Array(W*H);
  try{const bin=atob(str);for(let i=0;i<v.length&&(i>>3)<bin.length;i++)if(bin.charCodeAt(i>>3)&(1<<(i&7)))v[i]=1;}catch(e){}
  return v;
}
function hasSave(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}
/* The world is regenerated from fixed seeds, so an old save can put you inside water or rock after an update. */
function fixPosition(){
  if(S.pos.room){if(!ROOMS[roomKind(S.pos.room)])S.pos={room:null,x:START[0],y:START[1]};else return;}
  const t=inb(S.pos.x,S.pos.y)?TILES[S.pos.y*W+S.pos.x]:TL.ROCK;
  if(S.boating&&t===TL.WATER)return;
  S.boating=false;
  if(!BLK[t]&&!NPCAT[S.pos.x+','+S.pos.y])return;
  const reach=reachFrom(START[0],START[1]);
  for(let r=1;r<60;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
    const x=S.pos.x+dx,y=S.pos.y+dy;
    if(inb(x,y)&&reach[y*W+x]){S.pos.x=x;S.pos.y=y;log('The land has shifted since you last played. You come to on open ground nearby.','info');return;}
  }
  S.pos={room:null,x:START[0],y:START[1]};
}
function loadGame(){
  try{
    const o=JSON.parse(localStorage.getItem(SAVE_KEY));
    let v;
    if(o.ver===VER&&o.vb)v=unpackVis(o.vb);
    else{
      /* An older save came from a smaller world: carry your place over, but the map starts unexplored. */
      v=new Uint8Array(W*H);
      if((o.ver||1)<2){if(o.pos&&!o.pos.room){o.pos.x*=2;o.pos.y*=2;}
      if(o.haven&&!o.haven.room){o.haven.x*=2;o.haven.y*=2;}}
      /* The original land now sits inside a larger world, so every coordinate moves over. */
      if((o.ver||1)<4){if(o.pos&&!o.pos.room){o.pos.x+=OX;o.pos.y+=OY;}if(o.haven&&!o.haven.room){o.haven.x+=OX;o.haven.y+=OY;}}
      o.lairs={};

    o.items=Object.assign({cord:0,silver:0,gilded:0,salve:0,tonic:0,boat:0},o.items);o.boating=!!o.boating;

/* ---------- experience ---------- */
function addXpPlayer(x){

    S.xp-=needP(S.lvl);S.lvl++;const m=pMax(S.lvl);S.hp=Math.min(m,S.hp+Math.ceil(m*.5));

}
function addXpC(c,x){

/* ---------- movement and the turn clock ---------- */
function enterRoom(id){S.pos={room:id,x:5,y:ROOMS[roomKind(id)].length-2};S.ents=[];S.arm=null;S.boating=false;}
function exitRoom(){const [dx,dy]=doorPos(S.pos.room);S.pos={room:null,x:dx,y:dy+1};S.arm=null;reveal();}
function reveal(){
  const px=S.pos.x,py=S.pos.y;
  for(let y=py-7;y<=py+7;y++)for(let x=px-7;x<=px+7;x++)if(inb(x,y)&&(x-px)*(x-px)+(y-py)*(y-py)<=49)S.vis[y*W+x]=1;
}
function move(dx,dy){
  S.face={x:dx,y:dy};S.arm=null;
  const nx=S.pos.x+dx,ny=S.pos.y+dy;
  if(S.pos.room){
    const ch=roomCh(S.pos.room,nx,ny);
    if(ch===undefined){render();return;}
    if(ch==='D'){exitRoom();endTurn();return;}
    if(roomBlocked(ch)){render();return;}
    S.pos.x=nx;S.pos.y=ny;endTurn();return;
  }
  if(!inb(nx,ny)){render();return;}
  const e=entAt(nx,ny);
  if(e){engage(e,false);return;}
  const nid=npcAt(nx,ny);
  if(nid){talkTo(nid);return;}
  const t=TILES[ny*W+nx];
  if(t===TL.WATER){
    if(!S.boating){
      if(!S.items.boat){hint('Deep water. You would need a boat to cross it.');render();return;}
      S.boating=true;log('You unfold your skiff and push off.','info');
    }
  }else{
    if(BLK[t]){render();return;}
    if(S.boating){S.boating=false;log('You fold the skiff away and step ashore.','info');}
  }
  S.pos.x=nx;S.pos.y=ny;S.steps++;reveal();
  if(S.boating&&t===TL.WATER)qSail();
  qVisit();
  if(t===TL.DOOR){enterRoom(DOORS[nx+','+ny]);endTurn();return;}
  const zk=zoneKeyAt(nx,ny);
  if(t===TL.TALL&&!ZN[zk].safe&&S.cool<=0&&Math.random()<.10*(1-fx('hush'))){
    const f=wildFor(zk);
    if(f&&ambushOK(f)){log('The undergrowth rustles. Something was waiting for you.','bad');startBattle(f,{ambush:true,zone:zk});return;}
  }
  if(t===TL.WATER&&!ZN[zk].safe&&S.cool<=0&&Math.random()<.09*(1-fx('hush'))){
    const f=wildFor(zk,true);
    if(f&&ambushOK(f)){log('The water churns. Something was waiting beneath the surface.','bad');startBattle(f,{ambush:true,zone:zk});return;}
  }
  endTurn();
}
function endTurn(){
  S.turn++;
  if(S.turn%(fx('regen')?4:12)===0&&S.hp<pMax(S.lvl))S.hp++;
  if(S.cool>0)S.cool--;
  if(S.mode==='world')tickEnts();
  render();
}
/* Land and water beasts come from separate pools: water=true picks an aquatic species for the zone's waters. */
/* Creatures that would be trivial for you no longer jump you, unless you have never met their kind. */
const ambushOK=f=>!f||!S.seen[f.sp]||foeLevelDiff(f)>-6;
const foeLevelDiff=f=>f.lvl-S.lvl;
function wildFor(zk,water,lvlBonus){
  /* Gloom beasts only come out at night. */
  const z=ZN[zk],all=WILDBY[zk+'|'+(water?'w':'l')],night=isNight(),pool=all&&all.filter(e=>night||SP[e.id].t!=='Gloom');
  if(!pool||!pool.length)return null;
  let tot=0;for(const e of pool)tot+=e.w;
  let x=Math.random()*tot,id=pool[0].id;
  for(const e of pool){x-=e.w;if(x<=0){id=e.id;break;}}
  let l=rand(z.lv[0],z.lv[1]);if(Math.random()<.12)l++;l+=(lvlBonus||0);
  /* Wild beasts are shown in the form their level calls for, so evolved forms roam the higher lands. Now and then a
     beast a few levels short of evolving turns up already grown ("elder"), at the level it evolves. */
  const base=id;let sp=SP[id];
  while(sp.evo&&l>=sp.evo[0])sp=SP[sp.evo[1]];
  if(sp.evo&&sp.evo[0]-l<=5&&Math.random()<.3){l=sp.evo[0];sp=SP[sp.evo[1]];}
  if(!night&&sp.t==='Gloom'&&SP[base].t!=='Gloom'){sp=SP[base];}
  return mkFoe(sp.id,l,false);
}
function mkFoe(id,l,elite){const st=cstat(id,l,elite);return{sp:id,lvl:l,elite:!!elite,hp:st.hp,max:st.hp,atk:st.atk,def:st.def,spd:st.spd};}
const foeName=f=>(f.elite?'Alpha ':'')+SP[f.sp].n;
/* Creatures never enter towns, never leave the zone they spawned in, and aquatic ones never leave the water. */
function entPassable(x,y,self,aq){
  if(!inb(x,y))return false;
  const t=TILES[y*W+x],water=self?self.aq:aq;
  if(water){if(t!==TL.WATER)return false;}else if(BLK[t])return false;
  const zk=zoneKeyAt(x,y);
  if(ZN[zk].safe)return false;
  if(self&&self.home&&zk!==self.home)return false;
  if(S.pos.x===x&&S.pos.y===y)return false;
  if(NPCAT[x+','+y])return false;
  return !S.ents.some(o=>o!==self&&o.x===x&&o.y===y);
}
function tickEnts(){
  if(S.pos.room)return;
  const px=S.pos.x,py=S.pos.y,safeP=isSafe();
  const night=isNight();
  S.ents=S.ents.filter(e=>Math.abs(e.x-px)+Math.abs(e.y-py)<=22&&(night||SP[e.sp].t!=='Gloom'));
  for(const e of S.ents.slice()){
    if(e.stun>0){e.stun--;continue;}
    const sp=SP[e.sp],d=Math.abs(e.x-px)+Math.abs(e.y-py);
    let mx=0,my=0,chase=false;
    if(sp.tp===2&&d<=5&&!safeP&&(e.lvl>S.lvl-6||!S.seen[e.sp])&&Math.random()<.78){
      chase=true;const dx=px-e.x,dy=py-e.y;
      if(Math.abs(dx)>=Math.abs(dy)){mx=Math.sign(dx);if(!mx||!entPassable(e.x+mx,e.y,e)&&!(e.x+mx===px&&e.y===py)){mx=0;my=Math.sign(dy);}}
      else{my=Math.sign(dy);if(!my||!entPassable(e.x,e.y+my,e)&&!(e.x===px&&e.y+my===py)){my=0;mx=Math.sign(dx);}}
    }else if(sp.tp===0&&d<=4&&Math.random()<.7){
      const dx=e.x-px,dy=e.y-py;if(Math.abs(dx)>=Math.abs(dy))mx=Math.sign(dx)||1;else my=Math.sign(dy)||1;
    }else if(Math.random()<.45){const m=pick(D4);mx=m[0];my=m[1];}
    if(!mx&&!my)continue;
    const nx=e.x+mx,ny=e.y+my;
    /* A creature may still strike you when you stand next to it, even across a zone border. */
    if(chase&&nx===px&&ny===py){
      log(`A level ${e.lvl} ${SP[e.sp].n} ${e.aq?'surges at you':'springs at you'}.`,'bad');
      startBattle(entFoe(e),{ambush:true,ent:e,zone:zoneKeyAt(e.x,e.y)});return;
    }
    if(entPassable(nx,ny,e)){e.x=nx;e.y=ny;}
  }
  if(S.ents.length<4&&Math.random()<.14){
    for(let a=0;a<12;a++){
      const x=px+rand(-9,9),y=py+rand(-9,9);
      if(Math.abs(x-px)+Math.abs(y-py)<6||!inb(x,y))continue;
      const aq=TILES[y*W+x]===TL.WATER;
      if(!entPassable(x,y,null,aq))continue;
      const zk=zoneKeyAt(x,y),f=wildFor(zk,aq);
      if(!f)continue;
      S.ents.push({sp:f.sp,lvl:f.lvl,x,y,stun:0,home:zk,aq});break;
    }
  }
}
const entFoe=e=>mkFoe(e.sp,e.lvl,false);
function engage(e,ambush){
  startBattle(entFoe(e),{ambush:!!ambush,ent:e,zone:zoneKeyAt(e.x,e.y)});
}

/* ---------- interaction ---------- */
function interact(){
  const {x,y}=S.pos,f=S.face;
  const cand=[[x+f.x,y+f.y],[x,y-1],[x,y+1],[x-1,y],[x+1,y]];
  for(const [cx,cy] of cand){
    if(S.pos.room){
      const ch=roomCh(S.pos.room,cx,cy);
      if(ch==='N'){npcTalk();return;}
      if(ch==='B'){restAtBed();return;}
    }else{
      if(!inb(cx,cy))continue;
      const e=entAt(cx,cy);if(e){engage(e,false);return;}
      const nid=npcAt(cx,cy);if(nid){talkTo(nid);return;}
      const t=TILES[cy*W+cx];
      if(t===TL.BENCH){S.panel='forge';UI.ftab='ring';UI.sel=0;render();return;}
      if(t===TL.SIGN){readSign(cx,cy);return;}
      if(t===TL.LAIR){lairAction(cx,cy);return;}
      if(t===TL.SHRINE){shrineAction(cx,cy);return;}
    }
  }
  log('There is nothing to use here.','info');render();
}
function readSign(x,y){
  S.sign=SIGNS[x+','+y];S.panel='sign';UI.sel=0;render();
}
function healAll(){
  S.hp=pMax(S.lvl);for(const c of S.cr)c.hp=cmax(c);
  S.haven={room:S.pos.room,x:S.pos.x,y:S.pos.y};
}
function restAtBed(){
  healAll();saveGame(true);
  log('You rest on the bed. You and your companions are fully healed, and your progress is saved.','good');render();
}
function npcTalk(){
  const k=roomKind(S.pos.room);
  if(k==='cottage'){
    if(!S.met){
      S.met=true;S.items.cord+=5;S.items.salve+=3;
      log('Marra: "Awake at last. I found you face down in the Greenmoor reeds with a hunting knife and no name."','info');
      log('Marra: "Take these. A hemp cord binds a beast to you, but only once you have worn it down. Hurt it first, then throw the cord from the Bind menu."','info');
      log('You receive 5 Hemp Cords and 3 Herbal Salves.','loot');
      log('Marra: "Mind the tall grass outside the walls. Nothing can touch you in Thistledown, and the bed here is yours whenever you need it."','info');
      talkTo('marra');return;
    }
    talkTo('marra');
  }else if(k==='healer'){
    healAll();saveGame(true);
    log('The healer tends your wounds and those of your companions. Everyone is fully healed. Progress saved.','good');render();
  }else if(k==='hall'){
    openHall();
  }else{
    const T=TOWNS.find(t=>t.id===zoneKey());S.shop=T.stock;S.panel='shop';render();
  }
}
function lairAction(x,y){
  const L=LAIRS.find(l=>l.x===x&&l.y===y),key=x+','+y;
  if(S.lairs[key]!==undefined&&S.turn-S.lairs[key]<480){log('The lair is empty for now. Something will return.','info');render();return;}
  if(SP[L.sp].t==='Gloom'&&!isNight()){log('The lair is silent. Whatever dwells here only stirs after dark.','info');render();return;}
  const lvl=ZN[L.z].lv[1]+3;
  if(!S.arm||S.arm!==key){
    S.arm=key;
    const dg=danger(lvl,S.lvl);
    log(`A level ${lvl} Alpha ${SP[L.sp].n} dwells in this lair (${dg.n} for you). Press E again to challenge it.`,'bad');render();return;
  }
  S.arm=null;
  startBattle(mkFoe(L.sp,lvl,true),{ambush:false,lair:key,zone:L.z});
}
function shrineAction(x,y){
  const h=SHRINES.find(s=>s.x===x&&s.y===y);if(!h)return;
  const key='shrine:'+h.id,st=S.shrines[h.id]||(S.shrines[h.id]={});
  if(st.done){log('The altar is quiet. Whatever slept here left with you.','info');render();return;}
  if(!h.need.every(r=>S.relics[r]>0)){log(`${h.n}. ${h.need.length} hollows are carved into the stone, shaped for things you do not hold.`,'info');render();return;}
  if(S.lairs[key]!==undefined&&S.turn-S.lairs[key]<480){log('The altar is still. Whatever answered has withdrawn for now. Come back later.','info');render();return;}
  if(S.arm!==key){S.arm=key;log('Your relics hum and slip into the hollows on their own. Something huge stirs below. Press E again to wake it, or walk away.','bad');render();return;}
  S.arm=null;
  log(`${SP[h.sp].n} rises from the stone.`,'bad');
  startBattle(mkFoe(h.sp,h.lvl,false),{ambush:false,lair:key,zone:h.zone});
}
function campOut(){
  if(isSafe()){log('You are safe within these walls. Rest on a bed to heal and save.','info');render();return;}
  if(S.boating){log('You cannot camp on open water. Come ashore first.','info');render();return;}
  S.turn+=8;
  S.hp=Math.min(pMax(S.lvl),S.hp+Math.ceil(pMax(S.lvl)*.4));
  for(const c of party())c.hp=Math.min(cmax(c),c.hp+Math.ceil(cmax(c)*.4));
  const zk=zoneKeyAt(S.pos.x,S.pos.y);
  if(Math.random()<.35*(1-fx('hush'))){{const f=wildFor(zk);if(f&&ambushOK(f)){log('You camp, but something finds you in the dark.','bad');startBattle(f,{ambush:true,zone:zk});return;}}}
  log('You camp for a while and recover about two fifths of your health. Camping outside the walls is a gamble.','info');
  tickEnts();render();
}
/* slot is 'you' or an index into party(). Returns true when an item was used. */
function usePack(kind,slot){
  if(kind==='salve'){
    if(S.items.salve<1){log('You have no salves left.','info');return false;}
    if(slot==='you'){
      if(S.hp>=pMax(S.lvl)){log('You are already at full health.','info');return false;}
      S.items.salve--;const h=Math.max(20,Math.ceil(pMax(S.lvl)/3));S.hp=Math.min(pMax(S.lvl),S.hp+h);log(`You apply a salve and recover ${h} HP.`,'good');return true;
    }
    const c=party()[slot];
    if(!c){log('There is no companion in that slot.','info');return false;}
    if(c.hp<=0){log(`${nm(c)} has fainted. A salve will not wake it. Use a revive tonic.`,'info');return false;}
    if(c.hp>=cmax(c)){log(`${nm(c)} is already at full health.`,'info');return false;}
    S.items.salve--;const h=Math.max(20,Math.ceil(cmax(c)/3));c.hp=Math.min(cmax(c),c.hp+h);log(`${nm(c)} recovers ${h} HP.`,'good');return true;
  }
  if(kind==='tonic'){
    if(S.items.tonic<1){log('You have no revive tonics left.','info');return false;}
    const c=party()[slot];
    if(!c){log('There is no companion in that slot.','info');return false;}
    if(c.hp>0){log(`${nm(c)} has not fainted.`,'info');return false;}
    S.items.tonic--;c.hp=Math.ceil(cmax(c)/2);log(`${nm(c)} wakes with new strength.`,'good');return true;
  }
  return false;
}

/* ---------- battle ---------- */
function startBattle(f,o){
  S.battle={foe:f,sub:null,guard:false,over:false,cd:{},ent:o.ent||null,lair:o.lair||null,zone:o.zone||zoneKey()};
  S.mode='battle';S.panel=null;S.seen[f.sp]=1;UI.tonic=false;qLive();
  setLock(LOCK_START);UI.noRepeat=true;
  if(!o.ambush)log(`You face a level ${f.lvl} ${foeName(f)}.`,'bad');
  if(o.ambush){foeAct();if(S.hp<=0){die();return;}S.battle.guard=false;}
  render();
}
function foeAct(){
  const B=S.battle,f=B.foe,sp=SP[f.sp],c=lead(),you=!c||Math.random()<.28;
  const mvs=movesFor(sp,f.lvl),ttype=you?'Plain':SP[c.sp].t;
  let mv;
  if(f.hp<f.max*.35&&mvs.some(m=>m.heal)&&Math.random()<.35)mv=mvs.find(m=>m.heal);
  else{
    const att=mvs.filter(m=>!m.heal),w=att.map(m=>1+(tmult(m.t,ttype)>1?1.5:0));
    let t=w.reduce((a,b)=>a+b,0)*Math.random();mv=att[0];
    for(let i=0;i<att.length;i++){t-=w[i];if(t<=0){mv=att[i];break;}}
  }
  const fn=foeName(f),pw=f.elite?ALPHA_PWR:1;
  if(mv.heal){const h=Math.ceil(f.max*mv.heal);f.hp=Math.min(f.max,f.hp+h);log(`${fn} uses Mend and recovers ${h} HP.`,'info');return;}
  if(you){
    let d=dmgCalc(f.lvl,mv.p*pw,f.atk,pDef(S.lvl),1);
    d=Math.max(1,Math.floor(d*(1-fx('guard'))));
    if(B.guard)d=Math.ceil(d/2);
    S.hp=Math.max(0,S.hp-d);log(`${fn} uses ${mv.n} on you for ${d} damage${B.guard?' (guarded)':''}.`,'bad');
  }else{
    const m=tmult(mv.t,ttype),d=dmgCalc(f.lvl,mv.p*pw,f.atk,cs(c).def,m);
    c.hp=Math.max(0,c.hp-d);log(`${fn} uses ${mv.n} on ${nm(c)} for ${d} damage.${effText(m)}`,'bad');
    if(c.hp<=0)log(`${nm(c)} collapses.`,'bad');
  }
}
function battleDone(){if(S.rage>0)S.rage--;for(const c of S.cr)if(c.rage>0)c.rage--;S.battle=null;S.mode='world';S.cool=4;setLock(LOCK_END);UI.noRepeat=true;UI.tonic=false;render();}
function tickCd(B){for(const k in B.cd)if(B.cd[k]>0)B.cd[k]--;}
function bAct(kind,arg){
  const B=S.battle;if(!B||B.over)return;
  const f=B.foe,c=lead();let used=true;
  if(kind==='move'){
    if(!c)return;const mv=movesFor(SP[c.sp],c.lvl)[arg];if(!mv)return;
    const key=cdKey(c,mv);
    if((B.cd[key]||0)>0){log(`${mv.n} is still recharging.`,'info');render();return;}
    if(mv.heal){const h=Math.ceil(cmax(c)*mv.heal);c.hp=Math.min(cmax(c),c.hp+h);log(`${nm(c)} uses Mend and recovers ${h} HP.`,'good');}
    else{
      const m=tmult(mv.t,SP[f.sp].t),P=mv.p*(c.alpha?ALPHA_PWR:1);
      const d=dmgCalc(c.lvl,P,cs(c).atk,f.def,m*bondMult()*rageC(c));
      f.hp=Math.max(0,f.hp-d);log(`${nm(c)} uses ${mv.n} for ${d} damage.${effText(m)}`,'good');
    }
    const cd=moveCd(mv);if(cd>0)B.cd[key]=cd+1;
  }else if(kind==='strike'){
    let d=dmgCalc(S.lvl,35,pAtk(S.lvl),f.def,(1+fx('strike'))*(S.rage>0?1.3:1));const crit=Math.random()<.08;if(crit)d=Math.floor(d*1.5);
    f.hp=Math.max(0,f.hp-d);log(`You strike with your knife for ${d} damage${crit?' (critical)':''}.`,'good');
  }else if(kind==='guard'){B.guard=true;log('You brace yourself. Incoming blows against you are halved this turn.','info');}
  else if(kind==='bind')used=tryBind(arg);
  else if(kind==='heal'){used=!!arg&&usePack(arg.item,arg.slot);}
  else if(kind==='swap'){
    const p=party()[arg];if(!p||p.hp<=0||p===c)return;
    S.cr.splice(S.cr.indexOf(p),1);S.cr.unshift(p);log(`${nm(p)} steps forward.`,'info');
  }else if(kind==='run')used=tryRun();
  if(!used){render();return;}
  B.sub=null;UI.tonic=false;
  if(B.over){return;}
  if(f.hp<=0){victory();return;}
  foeAct();
  if(S.hp<=0){die();return;}
  B.guard=false;tickCd(B);render();
}
function foeXp(f){
  const mult=clamp(1+0.12*(f.lvl-S.lvl),.1,2);
  return Math.max(1,Math.floor((8*f.lvl+12)*mult*(f.elite?3:1)));
}
function rewards(f,share){
  const xp=Math.max(1,Math.floor(foeXp(f)*share*(1+fx('xp')))),pl=S.lvl;
  addXpPlayer(xp);
  const act=lead();
  /* Companions below your level earn bonus XP: +25% per level behind, up to double. */
  for(const c of party()){if(c.hp>0){const base=c===act?xp:Math.ceil(xp/2);addXpC(c,Math.ceil(base*catchUp(c,pl)));}}
  const g=Math.floor((Math.floor(f.lvl*(2+Math.random()*3))*(f.elite?3:1)+1)*(1+fx('gold')));
  S.gold+=g;log(`You gain ${xp} experience and ${g} gold.`,'loot');
  if(Math.random()<(f.elite?1:.12)){const k=f.elite?'silver':'cord';S.items[k]++;log(`You find a ${IT[k].n}.`,'loot');}
  if(Math.random()<.07){S.items.salve++;log('You find an Herbal Salve.','loot');}
  lootMats(f);
}
function victory(){
  const B=S.battle,f=B.foe;B.over=true;S.kills++;
  log(`The ${foeName(f)} is defeated.`,'good');rewards(f,1);qEvent('kill',f,B.zone);
  if(B.ent)S.ents=S.ents.filter(e=>e!==B.ent);
  if(B.lair)S.lairs[B.lair]=S.turn;
  battleDone();
}
function bindChance(item){
  const f=S.battle.foe,sp=SP[f.sp];
  const base=sp.c*(f.elite?.6:1)*(1.15-.85*(f.hp/f.max))*IT[item].p*clamp(1-.06*(f.lvl-S.lvl),.35,1.15);
  return clamp(base*(1+fx('bind'))*(S.musk>0?1.4:1),.02,.95);
}
function tryBind(item){
  if(!IT[item]||!IT[item].p||S.items[item]<1)return false;
  const B=S.battle,f=B.foe;S.items[item]--;
  log(`You hurl a ${IT[item].n} at the ${foeName(f)}.`,'info');
  const held=Math.random()<bindChance(item);
  if(S.musk>0)S.musk--;
  if(held){
    const c={id:S.uid++,sp:f.sp,lvl:f.lvl,xp:0,hp:1,p:party().length<4,alpha:!!f.elite};
    c.hp=Math.max(1,Math.round(cmax(c)*(f.hp/f.max)));
    S.cr.push(c);S.caught[f.sp]=(S.caught[f.sp]||0)+1;
    log(`The cord holds. ${f.elite?'Alpha ':''}${SP[f.sp].n} is now bound to you${c.p?'.':' and waits in the stable.'}`,'good');
    B.over=true;rewards(f,.5);qEvent('bind',f,B.zone);qLive();
    if(B.lair&&B.lair.indexOf('shrine:')===0){
      const h=SHB[B.lair.slice(7)];for(const r of h.need)S.relics[r]--;
      S.shrines[h.id]={done:1,known:1};log('The relics crumble to dust in your pack. The altar goes quiet.','good');
    }
    if(B.ent)S.ents=S.ents.filter(e=>e!==B.ent);
    if(B.lair)S.lairs[B.lair]=S.turn;
    battleDone();return true;
  }
  log('The cord snaps loose. The beast is still free.','bad');return true;
}
function tryRun(){
  const B=S.battle,f=B.foe;
  const ch=clamp(.5+(S.lvl-f.lvl)*.08+fx('flee'),.15,.95);
  if(Math.random()<ch){
    log('You break away and escape.','info');B.over=true;
    if(B.ent){B.ent.stun=6;S.ents=S.ents.filter(e=>e!==B.ent);}
    battleDone();return true;
  }
  log('You cannot get away.','bad');return true;
}
function die(){
  const B=S.battle,f=B?B.foe:null;
  const cause=f?`Slain by a level ${f.lvl} ${foeName(f)} in ${ZN[B.zone].n}.`:'You did not survive.';
  S.dead={cause};S.mode='dead';S.battle=null;S.panel=null;
  if(S.hard)wipeSave();
  render();
}
function respawn(){
  S.gold=Math.floor(S.gold*.75);S.hp=pMax(S.lvl);
  for(const c of S.cr)c.hp=Math.max(1,Math.ceil(cmax(c)*.5));
  const h=S.haven;S.pos={room:h.room,x:h.x,y:h.y};S.ents=[];S.dead=null;S.mode='world';S.cool=4;S.boating=false;
  log('You wake at your last resting place, shaken. A quarter of your gold is gone, and your companions are only half healed.','bad');
  render();
}

/* ---------- materials, recipes, rings and potions ---------- */
function giveMats(m){
  for(const id in m){S.mats[id]=(S.mats[id]||0)+m[id];log(`You receive ${MATS[id].n}${m[id]>1?' ×'+m[id]:''}.`,'loot');}
  checkRecipes();
}
function hasAll(need){for(const id in need)if((S.mats[id]||0)<need[id])return false;return true;}
/* A formula reveals itself only once you hold every ingredient it calls for. */
function checkRecipes(){
  for(const r of RECIPES){
    if(S.recipes[r.id]||!hasAll(r.need))continue;
    S.recipes[r.id]=1;
    log(`Recipe unlocked: ${r.n}. Make it at a work table in any town.`,'good');
  }
}
function lootMats(f){
  const B=S.battle,tbl=B&&DROPS[B.zone];if(!tbl)return;
  const ids=Object.keys(tbl),tot=ids.reduce((a,k)=>a+tbl[k],0);
  const rolls=f.elite?2:(Math.random()<.10*(1+fx('forage'))?1:0);
  for(let r=0;r<rolls;r++){
    let x=Math.random()*tot,id=ids[0];
    for(const k of ids){x-=tbl[k];if(x<=0){id=k;break;}}
    giveMats({[id]:1});
  }
}
function craft(id){
  const r=RC[id];if(!r||!S.recipes[id])return false;
  if(r.kind==='ring'&&S.rings[id]){log(`You already forged the ${r.n}.`,'info');return false;}
  if(!hasAll(r.need)){log('You are missing ingredients.','bad');return false;}
  for(const k in r.need)S.mats[k]-=r.need[k];
  if(r.kind==='ring'){S.rings[id]=1;log(`You forge the ${r.n}. Put it on from Gear (G).`,'good');}
  else{S.pot[id]=(S.pot[id]||0)+1;log(`You brew a ${r.n}. Use it from Gear (G).`,'good');}
  return true;
}
function toggleRing(id){
  if(!S.rings[id])return;
  const i=S.equip.indexOf(id);
  if(i>=0){S.equip.splice(i,1);log(`You take off the ${RC[id].n}.`,'info');}
  else if(S.equip.length>=2){log('You can wear two rings at most. Take one off first.','bad');return;}
  else{S.equip.push(id);log(`You put on the ${RC[id].n}.`,'good');}
  S.hp=Math.min(S.hp,pMax(S.lvl));
}
/* slot is 'you' or an index into party(). */
function usePotion(id,slot){
  const r=RC[id];if(!r||!(S.pot[id]>0))return false;
  const you=slot==='you',c=you?null:party()[slot];
  if(!you&&!c){log('There is no companion in that slot.','info');return false;}
  const who=you?'You':nm(c),k=r.pot;
  if(k==='heal'){
    if(you){if(S.hp>=pMax(S.lvl)){log('You are already at full health.','info');return false;}S.hp=pMax(S.lvl);}
    else{
      if(c.hp<=0){log(`${nm(c)} has fainted. Use a Phoenix Philter or a revive tonic.`,'info');return false;}
      if(c.hp>=cmax(c)){log(`${nm(c)} is already at full health.`,'info');return false;}
      c.hp=cmax(c);
    }
    log(`${who} drink${you?'':'s'} a Sunroot Draught and ${you?'are':'is'} fully healed.`,'good');
  }else if(k==='revive'){
    if(you||c.hp>0){log('That only works on a fainted companion.','info');return false;}
    c.hp=cmax(c);log(`${nm(c)} rises, bright-eyed, at full health.`,'good');
  }else if(k==='hp'||k==='atk'||k==='def'){
    const tgt=you?S.bonus:(c.bonus||(c.bonus={})),tag='p_'+k;
    if(tgt[tag]){log(`${who} ${you?'have':'has'} already benefited from that.`,'info');return false;}
    const before=you?pMax(S.lvl):cmax(c);
    tgt[k]=(tgt[k]||0)+.08;tgt[tag]=1;
    const after=you?pMax(S.lvl):cmax(c);
    if(k==='hp'){if(you)S.hp+=after-before;else if(c.hp>0)c.hp+=after-before;}
    log(`${who} ${you?'feel':'looks'} ${k==='hp'?'sturdier':k==='atk'?'fiercer':'tougher'} for good.`,'good');
  }else if(k==='rage'){
    if(you)S.rage=3;else c.rage=3;
    log(`${who} ${you?'burn':'burns'} with fury. Damage is up 30% for the next 3 fights.`,'good');
  }else if(k==='growth'){
    if(you)addXpPlayer(Math.floor(needP(S.lvl)*.5));else addXpC(c,Math.floor(needC(c.lvl)*.6));
    log(`${who} ${you?'feel':'looks'} wiser.`,'good');
  }else if(k==='musk'){
    if(!you){log('The musk is for you to drink. The beasts would only be insulted.','info');return false;}
    S.musk=3;log('You smell like an old friend to every beast in the wild. Your next 3 bind attempts are likelier to hold.','good');
  }
  S.pot[id]--;return true;
}

/* ---------- quests ---------- */
const npcAt=(x,y)=>NPCAT[x+','+y]||null;
function objNeed(o){return o.t==='visit'?1:(o.n||1);}
function objHave(q,i){
  const o=q.obj[i],st=S.q[q.id];
  if(o.t==='seen')return Object.keys(S.seen).length;
  if(o.t==='caught')return Object.keys(S.caught).filter(k=>S.caught[k]>0).length;
  return st?(st.p[i]||0):0;
}
const objDone=(q,i)=>objHave(q,i)>=objNeed(q.obj[i]);
const qComplete=q=>q.obj.every((o,i)=>objDone(q,i));
const qAvail=q=>!S.q[q.id]&&(!q.after||(S.q[q.after]&&S.q[q.after].st==='done'));
const qOpen=q=>qAvail(q)&&S.lvl>=(q.min||1);
const qActive=q=>S.q[q.id]&&S.q[q.id].st==='active';
function qNotify(q){
  const st=S.q[q.id];
  if(st&&st.st==='active'&&!st.r&&qComplete(q)){st.r=1;const id=q.turnin||q.giver;log(`Quest ready: ${q.title}. Hand it in to ${NPCS[id].n} (${NPCS[id].place}).`,'good');}
}
function qMatch(o,f,zone){
  if(o.sp&&![].concat(o.sp).includes(f.sp))return false;
  if(o.zone&&![].concat(o.zone).includes(zone))return false;
  if(o.aq!=null&&!!SP[f.sp].aq!==o.aq)return false;
  if(o.elite&&!f.elite)return false;
  if(o.minLvl&&f.lvl<o.minLvl)return false;
  return true;
}
function qEvent(mode,f,zone){
  for(const q of QUESTS){
    if(!qActive(q))continue;const st=S.q[q.id];
    q.obj.forEach((o,i)=>{
      if(!qMatch(o,f,zone))return;
      if(o.t===mode&&st.p[i]<objNeed(o)){st.p[i]++;log(`Quest: ${q.title}. ${o.label} ${st.p[i]}/${objNeed(o)}.`,'info');}
      else if(o.t==='item'&&st.p[i]<o.n&&Math.random()<o.chance*(mode==='kill'?1:.6)){st.p[i]++;log(`You find: ${o.name} (${st.p[i]}/${o.n}).`,'loot');}
    });
    qNotify(q);
  }
}
function qLive(){for(const q of QUESTS)if(qActive(q)&&q.obj.some(o=>o.t==='seen'||o.t==='caught'))qNotify(q);}

/* ---------- the duel engine ---------- */
let DSEQ=1;
function mkUnit(sp,lvl,alpha,src){
  const st=src?cs(src):cstat(sp,lvl,alpha);
  return{id:src?'m'+src.id:'r'+(DSEQ++),sp,lvl,alpha:!!alpha,max:st.hp,hp:st.hp,atk:st.atk,def:st.def,spd:st.spd,cd:{},mult:src?bondMult()*rageC(src):BOND};

function newDuel(a,b,rk,mute){return{s:[{u:a,a:0},{u:b,a:0}],tr:['brawler','brawler'],nm:'Rival',rk,g:[false,false],t:0,over:false,win:-1,lg:[],need:false,auto:!!mute,mute:!!mute};}
const dlg=(D,t,k)=>{if(!D.mute){D.lg.push({t,k:k||''});if(D.lg.length>40)D.lg.shift();}};
const dn=(D,i,u)=>(i===0?'Your ':D.nm+"'s ")+SP[u.sp].n;
const alive=sd=>sd.u.filter(x=>x.hp>0).length;
/* Choose who steps in after a faint: the beast with the best type matchup and the most health. */
function bestReplacement(D,i){
  const sd=D.s[i],o=D.s[1-i].u[D.s[1-i].a];let best=-1,bs=-1;
  sd.u.forEach((x,k)=>{if(x.hp<=0)return;const s=tmult(SP[x.sp].t,SP[o.sp].t)/tmult(SP[o.sp].t,SP[x.sp].t)+x.hp/x.max;if(s>bs){bs=s;best=k;}});
  return best;
}
function aiAct(D,i){
  const sd=D.s[i],ot=D.s[1-i],u=sd.u[sd.a],o=ot.u[ot.a],tr=D.tr[i],noise=NOISE[D.rk]||0;
  const mvs=movesFor(SP[u.sp],u.lvl).map((m,k)=>({m,k})).filter(x=>!(u.cd[x.m.n]>0));
  const atk=mvs.filter(x=>!x.m.heal),heal=mvs.find(x=>x.m.heal);
  if(!atk.length)return{k:'guard'};
  const est=x=>dmgRaw(u.lvl,x.m.p*(u.alpha?ALPHA_PWR:1),u.atk,o.def,tmult(x.m.t,SP[o.sp].t))*u.mult;
  const hpf=u.hp/u.max,bench=[];sd.u.forEach((x,k)=>{if(k!==sd.a&&x.hp>0)bench.push(k);});
  if(Math.random()<noise)return{k:'move',i:pick(atk).k};
  if(heal&&hpf<.35&&Math.random()<(tr==='tactician'||tr==='turtle'?.7:.3))return{k:'move',i:heal.k};
  if(tr==='turtle'&&hpf<.5&&Math.random()<.3)return{k:'guard'};
  if(tr==='tactician'&&bench.length&&tmult(SP[o.sp].t,SP[u.sp].t)>1&&Math.random()<.55){
    let bk=-1,bs=0;for(const k of bench){const x=sd.u[k],s=tmult(SP[x.sp].t,SP[o.sp].t)/tmult(SP[o.sp].t,SP[x.sp].t)+x.hp/x.max;if(s>bs){bs=s;bk=k;}}
    if(bk>=0&&bs>1.4)return{k:'swap',i:bk};
  }
  if(tr==='gambler'&&Math.random()<.3)return Math.random()<.2?{k:'guard'}:{k:'move',i:pick(atk).k};

/* One turn: swaps and guards happen first, then attacks in order of speed. A beast that faints cannot act. */
function duelTurn(D,acts){
  const SD=D.s;D.g=[false,false];
  for(let i=0;i<2;i++){
    const a=acts[i];
    if(a.k==='swap'&&SD[i].u[a.i]&&SD[i].u[a.i].hp>0){SD[i].a=a.i;dlg(D,`${i===0?'You send out':D.nm+' sends out'} ${SP[SD[i].u[a.i].sp].n}.`,i?'bad':'good');}
  }
  for(let i=0;i<2;i++)if(acts[i].k==='guard'){D.g[i]=true;dlg(D,`${dn(D,i,SD[i].u[SD[i].a])} braces for the blow.`,'info');}
  const order=[0,1].filter(i=>acts[i].k==='move');
  order.sort((x,y)=>(SD[y].u[SD[y].a].spd-SD[x].u[SD[x].a].spd)||(Math.random()<.5?-1:1));
  for(const i of order){
    const u=SD[i].u[SD[i].a],t=SD[1-i].u[SD[1-i].a];
    if(u.hp<=0||t.hp<=0)continue;
    const mv=movesFor(SP[u.sp],u.lvl)[acts[i].i];
    if(!mv||(u.cd[mv.n]||0)>0)continue;
    if(mv.heal){const h=Math.ceil(u.max*mv.heal);u.hp=Math.min(u.max,u.hp+h);dlg(D,`${dn(D,i,u)} uses Mend and recovers ${h} HP.`,i?'info':'good');}
    else{
      const m=tmult(mv.t,SP[t.sp].t);let d=dmgCalc(u.lvl,mv.p*(u.alpha?ALPHA_PWR:1),u.atk,t.def,m*u.mult);
      if(D.g[1-i])d=Math.max(1,Math.ceil(d/2));
      t.hp=Math.max(0,t.hp-d);
      dlg(D,`${dn(D,i,u)} uses ${mv.n} on ${dn(D,1-i,t)} for ${d} damage.${effText(m)}`,i?'bad':'good');
      if(t.hp<=0)dlg(D,`${dn(D,1-i,t)} collapses.`,i?'bad':'good');
    }
    const cd=moveCd(mv);if(cd>0)u.cd[mv.n]=cd+1;
  }
  for(const sd of SD)for(const u of sd.u)for(const k in u.cd)if(u.cd[k]>0)u.cd[k]--;

    if(sd.u[sd.a].hp>0)continue;
    if(!alive(sd)){D.over=true;D.win=1-i;break;}
    if(i===1||D.auto){sd.a=bestReplacement(D,i);dlg(D,`${i===0?'You send out':D.nm+' sends out'} ${SP[sd.u[sd.a].sp].n}.`,i?'bad':'good');}
    else D.need=true;
  }
  /* A bout that drags on is decided by who has more health left. */
  if(!D.over&&D.t>=70){
    const f=sd=>sd.u.reduce((a,x)=>a+x.hp/x.max,0);
    D.over=true;D.win=f(SD[0])>f(SD[1])?0:f(SD[0])<f(SD[1])?1:(Math.random()<.5?0:1);
    dlg(D,'The judges call time and score the bout on remaining health.','info');
  }
}
function simSeries(ra,rb,bo,rk){
  const sc=[0,0],need=Math.ceil(bo/2);

    D.tr=[ra.tr,rb.tr];

/* ---------- the bracket ---------- */
function shuffled(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

/* A rival picks a lead from what it can see of your squad: species, types and levels only. It never sees which beast you chose. */
function aiLead(team,seen,rk,tr){

function pickLead(k){const T=S.tour;if(T&&T.phase==='pre'&&k>=0&&k<T.squad.length)T.lead=k;}

  D.s[0].a=my;D.s[1].a=their;T.lead=0;T.opp.team.forEach(t=>{S.seen[t.sp]=1;});
  dlg(D,`Both leads are revealed. You send out ${SP[D.s[0].u[my].sp].n}. ${T.opp.name} sends out ${SP[D.s[1].u[their].sp].n}.`,'info');

function duelAct(kind,i){
  const T=S.tour,D=T.D;if(!D||D.over)return;

/* Rewards are applied once, when the bracket is over for you. */

  let out=0;T.rounds.forEach((rd,k)=>{if(rd.some(isYou))out=k;});
  const champ=T.champ==='you';
  const share=champ?1:out===N-1?.5:out===N-2?.25:out===N-3?.12:.04;
  const place=champ?'Champion':out===N-1?'Runner-up':'Out in the '+names[out];
  const lines=[];
  const gold=Math.floor(R.gold*share);S.gold+=gold;lines.push(`${gold} gold`);
  let total=0;for(const k of T.kills)total+=foeXp({lvl:k.lvl,elite:k.alpha});
  const pl=S.lvl,xm=1+fx('xp');
  const px=Math.ceil(total*.5*xm);addXpPlayer(px);
  for(const id of T.squad){const c=S.cr.find(x=>x.id===id);if(c)addXpC(c,Math.ceil(total*.6*xm*catchUp(c,pl)));}
  lines.push(`${px} experience for you, and a share for each companion that fought`);
  let ranked=false;
  if(champ){
    for(const k in R.items){S.items[k]+=R.items[k];lines.push(`${R.items[k]} × ${IT[k].n}`);}
    const mm={};for(const kind of R.mats){const pool=MD.filter(m=>m[2]===kind),m=pick(pool)[0];mm[m]=(mm[m]||0)+1;}
    giveMats(mm);for(const id in mm)lines.push(`${MATS[id].n}${mm[id]>1?' × '+mm[id]:''}`);

  }
  T.res={place,champ,lines,ranked,champName:champ?'You':RIVBY[T.champ].name};
  log(`${R.n}: ${place}. You earn ${gold} gold and ${px} experience.`,champ?'good':'info');

}

function arenaKey(k){
  const T=S.tour;if(!T)return;
  const go=k==='Enter'||k===' '||k==='e';
  UI.noRepeat=true;
  if(T.phase==='bracket'){
    if(go){T.wd=false;bracketNext();}
    else if(k==='Escape'){if(T.wd){T.wd=false;withdraw();}else T.wd=true;}
    render();return;
  }
  if(T.phase==='pre'){const n=parseInt(k,10);if(n>=1&&n<=3)pickLead(n-1);else if(go)gameBegin();render();return;}
  if(T.phase==='post'){if(go)postNext();render();return;}
  if(T.phase==='final'){if(go)exitTour();else render();return;}
  const D=T.D;if(!D)return;
  const n=parseInt(k,10);
  if(D.need){if(n>=1&&n<=3)duelAct('swap',n-1);render();return;}
  if(D.sub==='swap'){
    if(k==='Escape')D.sub=null;
    else if(n>=1&&n<=3)duelAct('swap',n-1);
    render();return;
  }
  if(k==='Escape'){
    if(D.yield){D.yield=false;matchEnd(false,true);}else D.yield=true;
    render();return;
  }
  D.yield=false;
  if(n>=1&&n<=4)duelAct('move',n-1);
  else if(k==='g')duelAct('guard');
  else if(k==='w'&&D.s[0].u.some((x,i)=>i!==D.s[0].a&&x.hp>0))D.sub='swap';
  render();
}

}
const typeStrong=t=>STRONG[t]||[];
const typeWeak=t=>Object.keys(STRONG).filter(k=>STRONG[k].includes(t));
const listOf=a=>a.length<2?(a[0]||'nothing'):a.length===2?a.join(' and '):a.slice(0,-1).join(', ')+', and '+a[a.length-1];
/* Explain what a type change means: old and new weaknesses, what it now beats, and any matchup that cuts both ways. */
function typeNote(a,b){
  const ws=typeWeak(b),st=typeStrong(b),both=st.filter(t=>ws.includes(t));
  const stOnly=st.filter(t=>!both.includes(t)),wkOnly=ws.filter(t=>!both.includes(t));
  let h=`Its attacks now use ${b}, so they hit ${listOf(st)} hard. It used to be weak to ${listOf(typeWeak(a))}; now it is weak to ${listOf(ws)}.`;
  if(both.length)h+=` ${b} and ${both.join(' and ')} beat each other, so expect that matchup to cut both ways.`;
  return h;
}

function drawTile(c,sx,sy,ts,t,zk,wx,wy,P){

      if(zk==='frost'){c.fillStyle='#E8F1F6';c.beginPath();c.moveTo(sx+u*5,sy+u*.8);c.lineTo(sx+u*6.7,sy+u*3.6);c.lineTo(sx+u*3.3,sy+u*3.6);c.closePath();c.fill();}
      break;

function drawMap(){

    offx=Math.floor((COLS-rw)/2);offy=Math.floor((ROWS-rh)/2);

      }

      c.fillStyle=P.cnt;c.strokeStyle=P.trunk;c.lineWidth=2;c.beginPath();c.roundRect(x0-w/2,y0-h/2,w,h,ts*.08);c.fill();c.stroke();

    }
    {const na=nightAmt(S.turn);if(na>0){c.fillStyle=`rgba(24,38,120,${(.24*na).toFixed(3)})`;c.fillRect(0,0,cv.width,cv.height);}}
    for(const id in NPCPOS){const p=NPCPOS[id],vx=p[0]-cx,vy=p[1]-cy;if(vx>=0&&vy>=0&&vx<COLS&&vy<ROWS)drawNpc(c,id,vx*ts,vy*ts,ts,P);}
    for(const e of S.ents){const vx=e.x-cx,vy=e.y-cy;if(vx>=0&&vy>=0&&vx<COLS&&vy<ROWS)drawEnt(c,e,vx*ts,vy*ts,ts,P);}

function zoneDangerColor(zk){const z=ZN[zk];return z.safe?'#2A9D8F':danger(Math.round((z.lv[0]+z.lv[1])/2),S.lvl).c;}
const RGBC={};

/* The whole map is painted pixel by pixel into one small image, then scaled up in a single draw. */
function drawWorldMap(){

    const vo=rgbOf(P.void);
    for(let i=0;i<W*H;i++){
      const zk=ZK[REG[i]],seen=S.vis[i],a=seen?.14:.34,tc=tint[zk],bc=seen?rgbOf(tileHex(TILES[i],zk,P)):vo,o=i*4;
      d[o]=bc[0]*(1-a)+tc[0]*a;d[o+1]=bc[1]*(1-a)+tc[1]*a;d[o+2]=bc[2]*(1-a)+tc[2]*a;d[o+3]=255;
    }

  }
  c.textAlign='center';c.textBaseline='middle';c.font='600 11px "IBM Plex Mono",ui-monospace,monospace';c.lineJoin='round';c.lineWidth=3;
  const lab=(t,x,y)=>{c.strokeStyle='rgba(0,0,0,.65)';c.strokeText(t,x*k,y*k);c.fillStyle='#FFFFFF';c.fillText(t,x*k,y*k);};

  for(const zk of WILDZ){

  }

  }
}

/* ---------- healing targets (shared by the pack and the battle Heal menu) ---------- */
function healState(item,slot){
  if(item==='salve'){
    if(S.items.salve<1)return'none left';
    if(slot==='you')return S.hp>=pMax(S.lvl)?'full health':'';
    const c=party()[slot];if(!c)return'no companion';
    if(c.hp<=0)return'fainted';
    return c.hp>=cmax(c)?'full health':'';
  }
  const c=party()[slot];
  if(S.items.tonic<1)return'none left';
  if(!c||c.hp>0)return'not fainted';
  return'';
}
function healRowsHTML(){
  const ps=party(),mx=pMax(S.lvl);
  const row=(tok,key,label,reason)=>`<button class="b" data-k="${tok}" ${reason?'disabled':''}><kbd>${key}</kbd> ${label}${reason?`<span class="sub">${reason}</span>`:''}</button>`;
  let h=`<h3>Herbal salves ×${S.items.salve}</h3><div class="cmds">`;
  h+=row('@sY','1',`Salve on you (${S.hp}/${mx} HP)`,healState('salve','you'));
  ps.forEach((c,i)=>{h+=row('@s'+i,String(i+2),`Salve on ${nm(c)} (${c.hp}/${cmax(c)} HP)`,healState('salve',i));});
  h+='</div>';
  const fainted=ps.map((c,i)=>[c,i]).filter(p=>p[0].hp<=0);
  h+=`<h3>Revive tonics ×${S.items.tonic}${UI.tonic?' · now press the companion number':''}</h3><div class="cmds">`;
  if(!fainted.length)h+=`<button class="b" disabled><kbd>T</kbd> Revive tonic<span class="sub">nobody has fainted</span></button>`;
  else for(const p of fainted)h+=row('@t'+p[1],'T'+(p[1]+2),`Revive ${nm(p[0])} (${p[0].hp}/${cmax(p[0])} HP)`,healState('tonic',p[1]));
  h+='</div>';
  return h;
}
function healKeyToTok(k){
  if(UI.tonic)return /^[2-5]$/.test(k)?'@t'+(+k-2):null;
  if(k==='1')return'@sY';
  if(/^[2-5]$/.test(k))return'@s'+(+k-2);

function healTok(tok){
  if(tok==='@sY')return{item:'salve',slot:'you'};

}

function titleHTML(){
  return `<div class="title"><div class="big">Beastmarch</div>
  <p>You wake in a land where magic has nearly run dry, but the old beasts still walk it: kitsune in the moors, griffins on the crags, drakes beyond the frozen ridge, and kelpies in the cold lakes. Wound them, bind them, and grow strong enough to cross the wild.</p>
  <p class="hint">Every land has a level range. Wander into one that is too strong for you and you can die.</p>
  <div class="row">${hasSave()?btn('c','Continue','pri'):''}${btn('n','New life',hasSave()?'':'pri')}${btn('h','Hardcore life','danger')}</div>
  <p class="hint">Hardcore: dying deletes your save. Standard: you wake at your last bed and lose a quarter of your gold.</p></div>`;
}
function deadHTML(){
  return `<div class="title"><h2>You died</h2><p>${S.dead.cause}</p>
  <p class="mono">Level ${S.lvl} · ${S.kills} beasts defeated · ${S.cr.length} companions bound · day ${day()}</p>
  <div class="row">${S.hard?'<p class="hint">Hardcore: your save is gone.</p>':btn('r','Wake at your last resting place','pri')}${btn('n','Start a new life',S.hard?'pri':'')}</div></div>`;
}
function battleHTML(){
  const B=S.battle,f=B.foe,sp=SP[f.sp],tc=TYPE[sp.t],dg=danger(f.lvl,S.lvl),c=lead(),m=pMax(S.lvl);
